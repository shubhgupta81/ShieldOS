name: Build ShieldOS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # setup-gradle downloads Gradle 8.7 and puts `gradle` on PATH, so the
      # repository does not need a committed wrapper.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ShieldOS.apk
          ls -lh dist

      - name: Keep a copy as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShieldOS-apk
          path: dist/ShieldOS.apk

      - name: Move the latest tag to this commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push origin latest --force

      - name: Create or update the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ShieldOS latest build
          body: |
            Debug-signed APK built from commit `${{ github.sha }}`.

            **Install in one tap**
            1. Download `ShieldOS.apk` below on your Android phone.
            2. Open it and allow installs from your browser or Files app when asked.
            3. Open ShieldOS and tap **Grant All Permissions**.

            Sideloaded app and the SMS permission is blocked? Open Settings, Apps, ShieldOS, tap the three-dot menu and choose **Allow restricted settings**.
          files: dist/ShieldOS.apk
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
